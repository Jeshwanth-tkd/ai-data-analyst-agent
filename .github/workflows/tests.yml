# Phase 15: GitHub Actions CI.
#
# Runs the pytest suite automatically on every push and every pull
# request against main. All tests mock the Groq client (see
# tests/test_code_executor.py and tests/test_insights.py), so this needs
# no API key / secret to run -- free, and safe on a public repo.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v